name: Flutter Android release

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Analyze and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Test Android CI patcher
        run: python3 .github/scripts/test_patch_flutter_android.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repository keeps only the portable Dart app source. Generate the
      # Android wrapper in the runner so releases use Flutter's current template.
      - name: Generate Android platform files
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.yousif .

      - name: Patch generated Android manifest and SDK settings
        run: python3 .github/scripts/patch_flutter_android.py --android-dir flutter_app/android

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: flutter_app
        run: flutter analyze

      - name: Build release APK
        working-directory: flutter_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://example.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'ci-placeholder-cloud' }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET || 'ci-placeholder-preset' }}
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          --dart-define=CLOUDINARY_CLOUD_NAME="$CLOUDINARY_CLOUD_NAME"
          --dart-define=CLOUDINARY_UPLOAD_PRESET="$CLOUDINARY_UPLOAD_PRESET"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yousf-marketplace-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare GitHub Release asset
        id: release_asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        working-directory: flutter_app
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="manual-${GITHUB_RUN_NUMBER}"
          fi
          asset_path="release/yousf-marketplace-${release_tag}.apk"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "$asset_path"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "asset=${asset_path}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_asset.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Yousf Marketplace ${{ steps.release_asset.outputs.tag }}
          files: flutter_app/${{ steps.release_asset.outputs.asset }}
          fail_on_unmatched_files: true
